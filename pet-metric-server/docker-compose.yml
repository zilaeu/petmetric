services:
  mysql:
    image: mysql:8.4
    container_name: pet-metric-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pet_metric
      MYSQL_USER: pet_metric
      MYSQL_PASSWORD: pet_metric_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - pet_metric_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pet_metric_mysql_data:
